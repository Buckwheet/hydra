# Poses for every family rigged from the "naga" template: a biped's torso on
# a serpent's coiled tail. See biped.toml for the angle conventions.

body_type = "naga"

[pose.stand]

[pose.stunned]
torso_upper = { rot = [20.0, 0.0, 0.0] }
neck = { rot = [22.0, 0.0, 0.0] }
skull = { rot = [18.0, 0.0, 0.0] }
arm = { rot = [-40.0, 0.0, 6.0], bend = [-10.0] }

[pose.fallen_side]
torso_lower = { rot = [30.0, -60.0, 0.0] }
torso_upper = { rot = [30.0, 0.0, 0.0] }
neck = { rot = [20.0, 0.0, 20.0] }
arm = { rot = [-30.0, 0.0, 30.0], bend = [-30.0] }

[pose.dead]
