# Poses for every family rigged from the "biped" template.
#
# ANGLES ONLY, in degrees, so a pose transfers to any family of this body
# type. Keys are BONE names. A key with no _l / _r that names no bone is a
# PAIR: "leg" poses leg_l as written and leg_r mirrored (y, z negated).
#
#   rot  = [x, y, z]  Euler, for the bone's FIRST segment about its pivot, in
#                     its parent's frame (x = left, y = up, z = front), applied
#                     Rx * Rz * Ry: twist (y), then spread (z), then swing (x).
#                     A limb hanging down: +x swings it BACK, -x forward;
#                     +z lifts a LEFT limb out to the side.
#   bend = [deg, ..]  one per INNER segment of the chain (elbow; knee, ankle;
#                     stifle, hock), about its natural hinge. + swings the far
#                     end BACK for a hanging limb: knees +, elbows -.
#   root = [x, y, z]  turns the whole figure about the root bone's pivot.
#
# No translations: after FK the figure is rested on the ground.

body_type = "biped"

[pose.stand]

[pose.arms_up]
arm = { rot = [0.0, 0.0, 152.0], bend = [-14.0] }

[pose.kneel]
leg = { bend = [87.0, 62.0] }
arm = { rot = [-6.0, 0.0, 0.0], bend = [-16.0] }

[pose.sit]
torso_lower = { rot = [-12.0, 0.0, 0.0] }
torso_upper = { rot = [10.0, 0.0, 0.0] }
leg = { rot = [-98.0, 0.0, 6.0], bend = [38.0, -14.0] }
arm = { rot = [32.0, 0.0, 8.0], bend = [-10.0] }

[pose.prone]
root = [90.0, 0.0, 0.0]
neck = { rot = [-18.0, 0.0, 0.0] }
arm = { rot = [0.0, 0.0, 28.0] }
leg = { rot = [0.0, 0.0, 5.0], bend = [0.0, 58.0] }

[pose.supine]
root = [-90.0, 0.0, 0.0]
arm = { rot = [0.0, 0.0, 30.0] }
leg = { rot = [0.0, 0.0, 6.0] }

[pose.fallen_side]
root = [0.0, 0.0, 90.0]
torso_upper = { rot = [14.0, 0.0, 0.0] }
neck = { rot = [10.0, 0.0, 0.0] }
leg_l = { rot = [-62.0, 0.0, 0.0], bend = [80.0] }
leg_r = { rot = [-28.0, 0.0, 0.0], bend = [48.0] }
arm_l = { rot = [-55.0, 0.0, 0.0], bend = [-50.0] }
arm_r = { rot = [-30.0, 0.0, 0.0], bend = [-70.0] }

# Slumped on its feet: head down, arms hanging forward, knees soft.
[pose.stunned]
torso_lower = { rot = [8.0, 0.0, 0.0] }
torso_upper = { rot = [24.0, 0.0, 0.0] }
neck = { rot = [26.0, 0.0, 0.0] }
skull = { rot = [22.0, 0.0, 0.0] }
arm = { rot = [-44.0, 0.0, 3.0], bend = [-10.0] }
leg = { rot = [-16.0, 0.0, 2.0], bend = [30.0, -12.0] }

# Status poses (the stage picks these from crtrStatus; a missing one falls
# back to its nearest: sleep -> fallen_side, disoriented -> stunned).

# Asleep: curled on its side, knees drawn up, hands by the face.
[pose.sleep]
root = [0.0, 0.0, 90.0]
torso_upper = { rot = [22.0, 0.0, 0.0] }
neck = { rot = [20.0, -10.0, 8.0] }
arm_l = { rot = [-65.0, -65.0, -30.0], bend = [-97.0] }
arm_r = { rot = [-80.0, 5.0, 15.0], bend = [-127.0] }
hand_l = { rot = [-45.0, 0.0, 0.0] }
hand_r = { rot = [-40.0, 0.0, 0.0] }
leg_l = { rot = [-120.0, 20.0, -23.0], bend = [125.0, 0.0] }
leg_r = { rot = [-120.0, 0.0, -8.0], bend = [125.0, 0.0] }

# Webbed: arms pinned to the body, legs bound together, head straining up.
[pose.webbed]
torso_upper = { rot = [0.0, 8.0, 0.0] }
neck = { rot = [-10.0, 0.0, 0.0] }
arm = { rot = [-4.0, 0.0, -6.0], bend = [-6.0] }
leg = { rot = [0.0, 0.0, -4.0] }

# Disoriented: head lolling to one side, an arm thrown out for balance,
# weight on one leg.
[pose.disoriented]
torso_upper = { rot = [6.0, 10.0, -8.0] }
neck = { rot = [14.0, 0.0, 14.0] }
skull = { rot = [8.0, 0.0, 12.0] }
arm_l = { rot = [-18.0, 0.0, 34.0], bend = [-30.0] }
arm_r = { rot = [12.0, 0.0, -4.0], bend = [-24.0] }
leg_l = { rot = [-8.0, 0.0, 9.0], bend = [16.0, -6.0] }
leg_r = { rot = [4.0, 0.0, -3.0], bend = [6.0] }

# Calmed: at ease, head lowered a little, arms loose.
[pose.calm]
neck = { rot = [10.0, 0.0, 0.0] }
skull = { rot = [8.0, 0.0, 0.0] }
arm = { rot = [-4.0, 0.0, -2.0], bend = [-14.0] }
leg = { bend = [4.0, -2.0] }

# Two ways to lie dead; a client picks one per creature by a stable hash
# (PoseSet::dead_name).
[pose.dead]
root = [0.0, 0.0, 90.0]
torso_upper = { rot = [10.0, 0.0, 0.0] }
neck = { rot = [24.0, 0.0, 0.0] }
leg_l = { rot = [-50.0, 0.0, 0.0], bend = [70.0] }
leg_r = { rot = [-16.0, 0.0, 0.0], bend = [30.0] }
arm_l = { rot = [-70.0, 0.0, 0.0], bend = [-30.0] }
arm_r = { rot = [-20.0, 0.0, 0.0], bend = [-40.0] }

[pose.dead_2]
root = [-90.0, 0.0, 0.0]
skull = { rot = [0.0, 40.0, 0.0] }
arm_l = { rot = [0.0, 0.0, 62.0], bend = [-35.0] }
arm_r = { rot = [0.0, 0.0, -18.0] }
leg_l = { rot = [0.0, 0.0, 14.0] }
leg_r = { rot = [-12.0, 0.0, -4.0], bend = [24.0] }


# ---------------------------------------------------------------- families
#
# Per-family corrections: `[family.<family>.<pose>]` replaces just the keys
# it names in that family's copy of the shared pose; everything it leaves
# out is inherited.
#
# `arms_up` is authored on the humanoid, whose arms hang close to its sides
# in the frontal plane. Poses are angles FROM REST, so an arm that rests
# angled well out (orc, ogre, giant) overshoots past vertical, and one that
# rests swung forward or back (the golem, treekin and elemental copy the
# stride in their side views, one arm forward, one back) keeps that swing
# and ends up in front of or behind the head. Each value below was solved
# per family and side for the same result: the wrist straight above the
# shoulder, 13 degrees out, in the frontal plane (rig_check / a probe of
# Posed::point; residual under 0.13 ft).

# The treekin's arms are short and its head is broad: straight up they
# vanish behind it, so its V is 45 degrees out instead of 13.
[family.treekin.arms_up]
arm_l = { rot = [45.0, 0.0, 90.0], bend = [-14.0] }
arm_r = { rot = [-70.0, 0.0, -70.0], bend = [-14.0] }

[family.golem.arms_up]
arm_l = { rot = [20.0, 0.0, 160.0], bend = [-14.0] }
arm_r = { rot = [-35.0, 0.0, -155.0], bend = [-14.0] }

[family.elemental.arms_up]
arm_l = { rot = [20.0, 0.0, 145.0], bend = [-14.0] }
arm_r = { rot = [-35.0, 0.0, -140.0], bend = [-14.0] }

[family.orc.arms_up]
arm = { rot = [-10.0, 0.0, 145.0], bend = [-14.0] }

[family.ogre.arms_up]
arm = { rot = [-10.0, 0.0, 140.0], bend = [-14.0] }

[family.troll.arms_up]
arm = { rot = [-30.0, 0.0, 150.0], bend = [-14.0] }

[family.giant.arms_up]
arm = { rot = [-5.0, 0.0, 140.0], bend = [-14.0] }

# The ghost's "legs" are the two halves of its robe. Folded like legs they
# lift out as two fat stumps; they stay hanging instead.
[family.ghost.sit]
torso_lower = { rot = [-6.0, 0.0, 0.0] }
leg = { rot = [-12.0, 0.0, 0.0] }

[family.ghost.dead]
leg = { rot = [0.0, 0.0, 0.0] }

# Joint limits: how far each bone may turn, [low, high] degrees per Euler
# angle (x swing, y twist, z spread) and per bend, as poses write them. A pair
# stem bounds the LEFT side; the right is mirrored. Every pose, blend and
# death fall is held inside these; the pose editor's sliders stop at them.
[limits]
torso_lower = { rot = [[-30.0, 45.0], [-30.0, 30.0], [-20.0, 20.0]] }
torso_upper = { rot = [[-30.0, 60.0], [-45.0, 45.0], [-30.0, 30.0]] }
neck = { rot = [[-40.0, 50.0], [-60.0, 60.0], [-35.0, 35.0]] }
skull = { rot = [[-40.0, 45.0], [-70.0, 70.0], [-30.0, 30.0]] }
arm = { rot = [[-180.0, 60.0], [-90.0, 90.0], [-30.0, 180.0]], bend = [[-150.0, 0.0]] }
leg = { rot = [[-125.0, 45.0], [-45.0, 45.0], [-30.0, 70.0]], bend = [[0.0, 150.0], [-45.0, 70.0]] }

# Breathing at rest (see `Pose::breathe`): amplitudes in degrees, one slow
# cycle. The chest lifts a little (torso_upper pitches back, the neck and
# head keep level), the shoulders rise with it, and the arms sway out and
# straighten a hair, lagging the chest by a sixth of a cycle.
[idle]
period = 4.2
torso_upper = { rot = [-3.0, 0.0, 0.0] }
clavicle = { rot = [-2.0, 0.0, 0.0] }
neck = { rot = [2.2, 0.0, 0.0] }
skull = { rot = [1.0, 0.0, 0.0] }
arm = { rot = [1.5, 0.0, 2.8], bend = [-2.2], phase = -0.16 }

# Flinches (see `Pose::flinched`): PEAK offsets for a hit on the region,
# written for the creature's RIGHT side and mirrored for the left. A quick
# snap and a spring back over half a second.
[flinch.head]
skull = { rot = [14.0, 0.0, -10.0] }
neck = { rot = [10.0, 0.0, -5.0] }
torso_upper = { rot = [4.0, 0.0, 0.0] }

[flinch.neck]
neck = { rot = [12.0, 0.0, 0.0] }
skull = { rot = [8.0, 0.0, 0.0] }
clavicle = { rot = [-6.0, 0.0, 0.0] }

# A blow to the chest: thrown back, arms come up, a step back.
[flinch.chest]
torso_upper = { rot = [12.0, 0.0, 0.0] }
torso_lower = { rot = [5.0, 0.0, 0.0] }
neck = { rot = [-6.0, 0.0, 0.0] }
arm = { rot = [-14.0, 0.0, 8.0], bend = [-16.0] }
leg_r = { rot = [8.0, 0.0, 0.0], bend = [10.0, -4.0] }

# A blow to the belly: doubled over.
[flinch.abdomen]
torso_upper = { rot = [-14.0, 0.0, 0.0] }
torso_lower = { rot = [-8.0, 0.0, 0.0] }
neck = { rot = [-4.0, 0.0, 0.0] }
arm = { rot = [-20.0, 0.0, 4.0], bend = [-30.0] }
leg = { bend = [8.0, -4.0] }

# From behind: arched, head thrown back.
[flinch.back]
torso_upper = { rot = [-8.0, 0.0, 0.0] }
torso_lower = { rot = [-4.0, 0.0, 0.0] }
neck = { rot = [-8.0, 0.0, 0.0] }
skull = { rot = [-6.0, 0.0, 0.0] }
arm = { rot = [-10.0, 0.0, 10.0] }

# Guarding a hurt back (held while the wound lasts, at 55 / 85 / 100% by
# rank): stooped, the head kept up, the right hand pressed to the small of
# the back.
[guard.back]
torso_upper = { rot = [14.0, 0.0, 0.0] }
torso_lower = { rot = [9.0, 0.0, 0.0] }
neck = { rot = [-9.0, 0.0, 0.0] }
skull = { rot = [-7.0, 0.0, 0.0] }
arm_r = { rot = [24.0, 55.0, 2.0], bend = [-85.0] }

# Held postures a status asks for (the doll's; `[posture.<name>]`, on top
# of an upright pose): terrified, cowering -- crouched, head
# tucked, forearms up before the face.
[posture.cower]
torso_upper = { rot = [18.0, 0.0, 0.0] }
torso_lower = { rot = [10.0, 0.0, 0.0] }
neck = { rot = [12.0, 0.0, 0.0] }
skull = { rot = [8.0, 0.0, 0.0] }
arm = { rot = [-70.0, 0.0, -12.0], bend = [-118.0] }
leg = { rot = [-24.0, 0.0, 3.0], bend = [42.0, -18.0] }

# Demoralized (feeble, less): slumped, head hung, arms dead weight.
[posture.slump]
torso_upper = { rot = [16.0, 0.0, 0.0] }
torso_lower = { rot = [4.0, 0.0, 0.0] }
neck = { rot = [18.0, 0.0, 0.0] }
skull = { rot = [12.0, 0.0, 0.0] }
arm = { rot = [-6.0, 0.0, -3.0], bend = [-5.0] }
leg = { bend = [8.0, -4.0] }

# Crippled: the right leg favoured, weight thrown on the left.
[posture.limp]
leg_r = { rot = [-18.0, 0.0, 8.0], bend = [44.0, -16.0] }
torso_lower = { rot = [0.0, 0.0, -9.0] }
torso_upper = { rot = [9.0, 0.0, 11.0] }
neck = { rot = [0.0, 0.0, -6.0] }
arm_r = { rot = [0.0, 0.0, -14.0], bend = [-12.0] }

# Staggered: thrown off balance, leaning back and aside, arms out to catch it.
[posture.stagger]
torso_upper = { rot = [-12.0, 0.0, -16.0] }
torso_lower = { rot = [-6.0, 0.0, -8.0] }
neck = { rot = [8.0, 0.0, 12.0] }
arm_l = { rot = [-24.0, 0.0, 55.0], bend = [-26.0] }
arm_r = { rot = [-16.0, 0.0, -14.0], bend = [-30.0] }
leg_l = { rot = [-14.0, 0.0, 16.0], bend = [14.0, -4.0] }

# Swaying (dazed, confused, staggered): side to side once round a breath.
[posture.sway]
torso_lower = { rot = [0.0, 0.0, 4.0] }
torso_upper = { rot = [3.0, 0.0, 5.0] }
neck = { rot = [0.0, 0.0, 6.0] }
skull = { rot = [0.0, 0.0, 5.0] }

# Trembling (terrified): small and quick, four times a breath.
[posture.tremble]
torso_upper = { rot = [1.5, 0.0, 1.0] }
neck = { rot = [2.0, 0.0, -1.5] }
arm = { rot = [2.5, 0.0, 1.5], bend = [-4.0] }

# The arm jerks back and out, the shoulder turns away, the near leg steps.
[flinch.arm]
arm_r = { rot = [-18.0, 0.0, 16.0], bend = [-20.0] }
clavicle = { rot = [0.0, -8.0, 0.0] }
torso_upper = { rot = [4.0, -8.0, 0.0] }
torso_lower = { rot = [0.0, -4.0, 0.0] }
leg_r = { rot = [8.0, 0.0, 0.0], bend = [6.0] }

[flinch.hand]
arm_r = { rot = [-12.0, 0.0, 10.0], bend = [-28.0] }
hand_r = { rot = [-20.0, 0.0, 0.0] }
torso_upper = { rot = [2.0, -5.0, 0.0] }

# The leg buckles and is drawn up; the hip drops toward it.
[flinch.leg]
leg_r = { rot = [-12.0, 0.0, 8.0], bend = [24.0, -8.0] }
torso_lower = { rot = [-4.0, 0.0, -6.0] }
torso_upper = { rot = [-4.0, 0.0, 4.0] }
arm_r = { rot = [0.0, 0.0, 12.0] }
