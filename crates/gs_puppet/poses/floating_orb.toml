# Poses for every family rigged from the "floating_orb" template: an orb
# with tendrils under it. See biped.toml for the angle conventions.

body_type = "floating_orb"

[pose.stand]

[pose.stunned]
orb = { rot = [15.0, 0.0, 10.0] }
leg1 = { rot = [0.0, 0.0, 20.0], bend = [15.0] }
leg2 = { rot = [0.0, 0.0, 30.0], bend = [20.0] }

[pose.fallen_side]
root = [0.0, 0.0, 70.0]
leg1 = { rot = [0.0, 0.0, -20.0], bend = [30.0] }
leg2 = { rot = [0.0, 0.0, -30.0], bend = [30.0] }

[pose.dead]
root = [0.0, 0.0, 90.0]
leg1 = { rot = [20.0, 0.0, -30.0], bend = [40.0] }
leg2 = { rot = [-20.0, 0.0, -40.0], bend = [40.0] }

[pose.dead_2]
root = [0.0, 0.0, 180.0]
leg1 = { rot = [0.0, 0.0, 40.0], bend = [-30.0] }
leg2 = { rot = [0.0, 0.0, 50.0], bend = [-30.0] }

[limits]
orb = { rot = [[-40.0, 40.0], [-90.0, 90.0], [-40.0, 40.0]] }
leg1 = { rot = [[-60.0, 60.0], [-60.0, 60.0], [-60.0, 90.0]], bend = [[-60.0, 60.0]] }
leg2 = { rot = [[-60.0, 60.0], [-60.0, 60.0], [-60.0, 90.0]], bend = [[-60.0, 60.0]] }

[idle]
period = 3.5
orb = { rot = [2.0, 0.0, 1.5] }
leg1 = { rot = [0.0, 0.0, 4.0], bend = [3.0], phase = -0.2 }
leg2 = { rot = [0.0, 0.0, 3.0], bend = [4.0], phase = -0.35 }

[flinch.head]
orb = { rot = [14.0, 0.0, -10.0] }
leg1 = { rot = [0.0, 0.0, 10.0] }
[flinch.chest]
orb = { rot = [12.0, 0.0, 0.0] }
[flinch.leg]
leg1_r = { rot = [0.0, 0.0, 25.0], bend = [20.0] }
