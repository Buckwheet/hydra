# The original package: the panic paths in `__cstring` read
# `crates/hydra/src/{main,gui,play,connect,rest,update,instance}.rs`
# (0x103e21a91 … 0x103e22d78), and the local symbol table carries `hydra::main`,
# `hydra::gui::*`, `hydra::play::*`, `hydra::replay::*`, `hydra::connect::*`,
# `hydra::instance::*`, `hydra::rest::*`, `hydra::started::*`,
# `hydra::startup::*`, `hydra::render::*`, `hydra::status::*` and
# `hydra::lookout_seed` — i.e. one binary crate.  See NOTES.md.

[package]
name = "hydra"
# The version the reference build reports as its own: `hydra_update::VERSION`,
# i.e. the `semver::Version::parse("0.1.0-beta.7")` call in `hydra::update::keep`
# (0x10009e744) and the `hydra/0.1.0-beta.7` user agent.
version = "0.1.0-beta.7"
edition = "2021"
description = "Hydra: the GemStone IV front end, recovered and running headless"

[[bin]]
name = "hydra"
path = "src/main.rs"

[dependencies]
# The three siblings the binary drives: `hydra::replay::replay` (0x100205ff4)
# calls `hydra_protocol`'s `Parser::push_bytes` directly, `hydra::play::run`
# drives `hydra_session::command::SessionHandle`, and the relay is
# `hydra_lich`'s.  `tokio` is the workspace pin (`cargo --offline`).
hydra_protocol = { path = "../hydra_protocol" }
hydra_session = { path = "../hydra_session" }
hydra_lich = { path = "../hydra_lich" }
# Phase 6: `hydra login`/`hydra play` log in for real — `hydra_net`'s eaccess
# handshake (`eaccess::handshake`) and game socket (`eaccess::game`) — and take
# the account, the game and the data folder from `hydra_table` (the roster and
# `account::data_dir`).  Both are the siblings the recovered `hydra::connect`
# (`0x10021b8d`) called.
hydra_net = { path = "../hydra_net" }
hydra_table = { path = "../hydra_table" }
# Phase 7: `hydra import` groups the recordings with `hydra_import::sessions`
# and records each one through `hydra_ledger::Ledger::note_import`.
hydra_import = { path = "../hydra_import" }
hydra_ledger = { path = "../hydra_ledger" }
tokio = { workspace = true }
# `hydra::gui::run` (`0x1001103f4`, 9716 bytes) is the eframe boundary: the
# recovered `hydra_gui::app::run` builds the "Hydra" window (660 × 520, "hub",
# wgpu) and `hydra::main`'s `gui` dispatch (`0x10021e144`) is the only caller.
# `eframe` is named here only so the tests can assert `Renderer::Wgpu` on the
# built `NativeOptions` — the types come from the same pinned git rev.
hydra_gui = { path = "../hydra_gui" }
# Phase 7: `hydra serve --web <port>` serves the headless page through
# `hydra_web::Server` (the recovered `hydra_web::Server`, `pairing::pairing` and
# `hydra_web::http::respond`).  Only the page and the accept loop are used — no
# mDNS (`bonjour`) and no websocket.
hydra_web = { path = "../hydra_web" }
eframe = { workspace = true }

[dev-dependencies]
# The loopback mock eaccess and game servers: every `play`/`login` integration
# test runs against these on 127.0.0.1, never a real host (see tests/login.rs).
hydra_mocks = { path = "../hydra_mocks" }
