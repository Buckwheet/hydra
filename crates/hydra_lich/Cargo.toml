[package]
name = "hydra_lich"
version = "0.0.0"
edition = "2021"

[dependencies]
# Phase 1 reconnection: the original relay linked tokio (bounded mpsc,
# BufReader, Mutex/RwLock/watch, process) and
# tokio_util::sync::CancellationToken.  Versions come from the workspace pins.
# `tokio-util` needs no extra feature flags in 0.7.19: `sync`, and therefore
# `CancellationToken`, is compiled unconditionally.
tokio = { workspace = true }
tokio-util = { workspace = true }

# Synthetic Lich stand-in for the loopback integration tests.  Declared as a
# real bin target so `tests/loopback.rs` can reach it through
# `env!("CARGO_BIN_EXE_fake_lich")`; nothing in the library references it.
[[bin]]
name = "fake_lich"
path = "tests/bin/fake_lich.rs"
